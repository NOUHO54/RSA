<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="light dark">
  <title>TP Cryptographie — Chiffrement</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="app-header">
  <div class="container header-inner">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4" y="11" width="16" height="10" rx="2"/>
          <path d="M8 11V7a4 4 0 0 1 8 0v4"/>
        </svg>
      </div>
      <div class="brand-text">
        <h1>TP Chiffrement RSA</h1>
        <p class="subtitle">AES-256-GCM · RSA-OAEP 2048</p>
      </div>
    </div>
    <div class="header-actions">
      <span class="badge" id="badge-keys">
        <span class="badge-dot"></span>
        <span id="badge-keys-text">Non initialisée</span>
      </span>
      <button class="btn btn-primary btn-sm" id="btn-generate-keys">
        Générer mes clés
      </button>
    </div>
  </div>
</header>

<main class="container">

  <section class="card card-identity" id="section-keys">
    <div class="card-header">
      <div class="card-header-left">
        <div class="icon-tile">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div>
          <h2>Identité cryptographique (RSA)</h2>
          <p class="card-sub">Vos composants mathématiques</p>
        </div>
      </div>
      <div class="card-header-actions">
        <button class="btn btn-secondary btn-sm" id="btn-copy-public">Copier clé pub (n, e)</button>
        <button class="btn btn-secondary btn-sm" id="btn-copy-private">Copier clé priv (n, d)</button>
        <button class="btn btn-danger-ghost btn-sm" id="btn-reset-keys">Réinitialiser</button>
      </div>
    </div>
    <div class="card-body" id="keys-body" hidden>
      
      <div class="row">
        <label>Module (n)</label>
      </div>
      <textarea id="txt-n" readonly rows="2" spellcheck="false"></textarea>

      <div class="row" style="margin-top: 1rem;">
        <label>Exposant public (e)</label>
      </div>
      <textarea id="txt-e" readonly rows="1" spellcheck="false"></textarea>

      <div class="row" style="margin-top: 1rem;">
        <label>Exposant privé (d) — À garder secret</label>
        <button class="btn btn-secondary btn-sm" onclick="document.getElementById('txt-d').type = document.getElementById('txt-d').type === 'password' ? 'text' : 'password'">Afficher/Masquer</button>
      </div>
      <textarea id="txt-d" readonly rows="2" spellcheck="false" type="password" style="-webkit-text-security: disc;"></textarea>

    </div>
    <div class="status" id="status-keys" hidden></div>
  </section>

  <div class="grid-2">
    <section class="card">
      <div class="card-header">
        <div class="card-header-left">
          <div class="icon-tile icon-tile-blue">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
            </svg>
          </div>
          <div>
            <h2>Chiffrer un fichier</h2>
            <p class="card-sub">Pour votre binôme</p>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="row">
          <label for="txt-recipient-key">Clé publique du destinataire (n, e)</label>
        </div>
        <textarea id="txt-recipient-key" rows="4" spellcheck="false"
          placeholder="Collez ici la clé publique de votre binôme (ex: n = 123...&#10;e = 65537)"></textarea>

        <div class="row" style="margin-top: 1rem;">
          <label for="input-file-encrypt">Fichier</label>
          <span class="meta" id="file-encrypt-meta"></span>
        </div>
        <label class="dropzone" id="dropzone-encrypt" for="input-file-encrypt">
          <input type="file" id="input-file-encrypt" hidden>
          <div class="dropzone-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="17 8 12 3 7 8"/>
              <line x1="12" y1="3" x2="12" y2="15"/>
            </svg>
          </div>
          <span class="dropzone-text">Glissez un fichier ou cliquez</span>
        </label>

        <button class="btn btn-primary btn-block" id="btn-encrypt">Chiffrer et télécharger</button>
        <div class="progress" id="progress-encrypt" hidden><div class="progress-bar"></div></div>
        <div class="status" id="status-encrypt" hidden></div>
      </div>
    </section>

    <section class="card">
      <div class="card-header">
        <div class="card-header-left">
          <div class="icon-tile icon-tile-green">
            <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
              <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
            </svg>
          </div>
          <div>
            <h2>Déchiffrer un fichier</h2>
            <p class="card-sub">Avec votre clé privée locale</p>
          </div>
        </div>
      </div>
      <div class="card-body">
        <div class="row">
          <label for="input-file-decrypt">Fichier chiffré (.enc)</label>
          <span class="meta" id="file-decrypt-meta"></span>
        </div>
        <label class="dropzone" id="dropzone-decrypt" for="input-file-decrypt">
          <input type="file" id="input-file-decrypt" accept=".enc" hidden>
          <div class="dropzone-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
              <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
              <polyline points="7 10 12 15 17 10"/>
              <line x1="12" y1="15" x2="12" y2="3"/>
            </svg>
          </div>
          <span class="dropzone-text">Glissez un fichier .enc ou cliquez</span>
        </label>

        <button class="btn btn-primary btn-block" id="btn-decrypt">Déchiffrer et télécharger</button>
        <div class="progress" id="progress-decrypt" hidden><div class="progress-bar"></div></div>
        <div class="status" id="status-decrypt" hidden></div>
      </div>
    </section>
  </div>

</main>

<footer class="app-footer">
  <div class="container footer-inner">
    <span>AES-256-GCM · RSA-OAEP 2048 · Web Crypto API</span>
    <span>TP Cryptographie</span>
  </div>
</footer>

<script type="module" src="js/main.js"></script>
</body>
</html>
